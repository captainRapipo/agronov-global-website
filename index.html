<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AGRONOV Global</title>

  <meta name="description"
    content="AGRONOV Global represents private brands on Amazon. We partner with brand owners, sell their products through our storefront and grow their sales." />
  <meta name="theme-color" content="#ffffff" />
  <meta property="og:title" content="AGRONOV Global" />
  <meta property="og:description"
    content="We represent private brands on Amazon and grow their sales." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://agronovglobal.com/" />

  <!-- Favicons -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=5" />
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png?v=5" />
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png?v=5" />
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=5" />

  <!-- Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap"
    rel="stylesheet" />

  <link rel="preload" as="image" href="AGRONOV-logo-tropical-4K.png" />

  <!-- applies the visitor's accessibility choices before the first paint -->
  <script src="a11y.js"></script>

  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      /* paper + ink — the ink is the logo's own black; colour lives in the logo only */
      --paper: #ffffff;
      --ink: #0a0a0a;
      --ink-70: #3d414b;
      --ink-45: #6b707c;
      --rule: rgba(10, 10, 10, 0.1);
      --focus: #0a0a0a;
      --amz: #ff9900;

      --ease: cubic-bezier(0.16, 1, 0.3, 1);
    }

    html {
      -webkit-text-size-adjust: 100%;
      /* driven by the accessibility panel's text-size control */
      font-size: calc(100% * var(--a11y-scale, 1));
    }

    body {
      min-height: 100dvh;
      background: var(--paper);
      color: var(--ink);
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
      font-weight: 400;
      font-feature-settings: "cv11", "ss03";
      letter-spacing: -0.005em;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* ───────────────────────────────  chrome  ─────────────────────────────── */

    .skip {
      position: absolute;
      left: 12px;
      top: -60px;
      z-index: 60;
      padding: 0.7rem 1.1rem;
      border-radius: 8px;
      background: var(--ink);
      color: #fff;
      font-size: 0.8rem;
      font-weight: 600;
      text-decoration: none;
      transition: top 0.2s ease;
    }

    .skip:focus { top: 12px; }

    :focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 4px;
      border-radius: 4px;
    }

    /* ───────────────────────────────  stage  ──────────────────────────────── */

    .stage {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: clamp(64px, 12vh, 120px) 24px clamp(40px, 6vh, 72px);
      text-align: center;
    }

    .brand {
      width: min(960px, 100%);
      animation: rise 1.2s var(--ease) 0.1s both;
    }

    .brand img {
      display: block;
      width: 100%;
      height: auto;
    }

    /* ── the one call to action, sitting just above the contact bar ── */
    .cta {
      display: flex;
      justify-content: center;
      padding-bottom: clamp(32px, 5vh, 48px);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.8rem;
      padding: 0.95rem 1.6rem;
      border: 1px solid var(--ink);
      border-radius: 999px;
      background: var(--ink);
      color: #fff;
      font-size: 0.74rem;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-decoration: none;
      white-space: nowrap;
      transition: background 0.3s ease, color 0.3s ease;
    }

    .btn:hover,
    .btn:focus-visible {
      background: #fff;
      color: var(--ink);
    }

    .btn .smile-ico {
      width: 24px;
      height: 12px;
      flex-shrink: 0;
      margin-top: 3px;
    }

    .btn .arrow {
      width: 13px;
      height: 13px;
      flex-shrink: 0;
      transition: transform 0.4s var(--ease);
    }

    .btn:hover .arrow,
    .btn:focus-visible .arrow { transform: translate(2px, -2px); }

    @keyframes rise {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: none; }
    }

    @keyframes fade {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    /* ───────────────────────────────  footer  ─────────────────────────────── */

    .colophon {
      width: min(1080px, calc(100% - 48px));
      margin: 0 auto;
      animation: fade 1s ease 0.55s both;
    }

    /* Email | Phone | Location — three equal columns on one hairline */
    .contact {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      border-top: 1px solid var(--rule);
      border-bottom: 1px solid var(--rule);
    }

    .item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding: 26px 16px;
      color: var(--ink);
      text-decoration: none;
      transition: background 0.3s ease;
    }

    .item + .item { border-left: 1px solid var(--rule); }

    .item:hover,
    .item:focus-visible { background: rgba(10, 10, 10, 0.025); }

    .label {
      font-size: 0.64rem;
      font-weight: 500;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--ink-45);
    }

    .value {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      font-size: 0.92rem;
      font-weight: 400;
      white-space: nowrap;
      text-decoration: underline;
      text-decoration-color: transparent;
      text-underline-offset: 5px;
      transition: text-decoration-color 0.3s ease;
    }

    .item:hover .value,
    .item:focus-visible .value { text-decoration-color: currentColor; }

    .flag {
      width: 20px;
      height: 14px;
      flex-shrink: 0;
      border-radius: 2px;
      box-shadow: 0 0 0 1px rgba(10, 10, 10, 0.1);
    }

    .copy {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 6px 18px;
      padding: 22px 0 clamp(22px, 3vh, 30px);
      font-size: 0.72rem;
      color: var(--ink-45);
    }

    .copy a {
      color: inherit;
      text-underline-offset: 3px;
      text-decoration-color: var(--rule);
      transition: color 0.25s ease;
    }

    .copy a:hover,
    .copy a:focus-visible { color: var(--ink); }

    /* ──────────────────────────  accessibility ui  ────────────────────────── */

    .a11y {
      position: fixed;
      right: clamp(14px, 2.4vw, 26px);
      bottom: clamp(14px, 2.4vw, 26px);
      z-index: 40;
    }

    .a11y-btn {
      display: grid;
      place-items: center;
      width: 44px;
      height: 44px;
      padding: 0;
      border: 1px solid var(--rule);
      border-radius: 50%;
      background: #fff;
      color: var(--ink-70);
      cursor: pointer;
      box-shadow: 0 8px 22px -12px rgba(10, 10, 10, 0.35);
      transition: color 0.25s ease, border-color 0.25s ease;
    }

    .a11y-btn svg {
      width: 22px;
      height: 22px;
    }

    .a11y-btn:hover,
    .a11y-btn:focus-visible {
      color: var(--ink);
      border-color: rgba(10, 10, 10, 0.3);
    }

    .a11y-panel {
      position: absolute;
      right: 0;
      bottom: calc(100% + 12px);
      width: min(290px, calc(100vw - 32px));
      padding: 14px;
      border: 1px solid var(--rule);
      border-radius: 14px;
      background: #fff;
      box-shadow: 0 26px 60px -20px rgba(10, 10, 10, 0.35);
      text-align: left;
      animation: pop-up 0.25s var(--ease) both;
    }

    @keyframes pop-up {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: none; }
    }

    .a11y-title {
      display: block;
      margin-bottom: 10px;
      padding: 0 4px;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--ink);
    }

    .a11y-opt {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      width: 100%;
      padding: 10px 12px;
      border: 0;
      border-radius: 9px;
      background: none;
      color: var(--ink);
      font: inherit;
      font-size: 0.83rem;
      font-weight: 500;
      text-align: left;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .a11y-opt:hover { background: rgba(10, 10, 10, 0.045); }

    .a11y-opt .state {
      flex-shrink: 0;
      font-size: 0.74rem;
      font-weight: 600;
      color: var(--ink-45);
    }

    .a11y-opt[aria-pressed="true"] { background: rgba(10, 10, 10, 0.055); }
    .a11y-opt[aria-pressed="true"] .state { color: var(--ink); }

    .a11y-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-top: 10px;
      padding: 10px 12px 2px;
      border-top: 1px solid var(--rule);
    }

    .a11y-foot a,
    .a11y-reset {
      border: 0;
      background: none;
      padding: 0;
      color: var(--ink-70);
      font: inherit;
      font-size: 0.76rem;
      text-decoration: underline;
      text-underline-offset: 3px;
      cursor: pointer;
    }

    .a11y-foot a:hover,
    .a11y-reset:hover { color: var(--ink); }

    /* — the four modes the panel can put the page into — */

    [data-hc="on"] {
      --ink: #000000;
      --ink-70: #000000;
      --ink-45: #1a1a1a;
      --rule: rgba(0, 0, 0, 0.55);
    }

    [data-hc="on"] body { background: #fff; }

    [data-hc="on"] .a11y-btn,
    [data-hc="on"] .a11y-panel { border-color: #000; background: #fff; }

    [data-links="on"] a:not(.skip):not(.btn),
    [data-links="on"] a .value {
      text-decoration: underline;
      text-decoration-color: currentColor;
      text-underline-offset: 4px;
      text-decoration-thickness: 2px;
    }

    [data-motion="off"] *,
    [data-motion="off"] *::before,
    [data-motion="off"] *::after {
      animation-duration: 0.01ms !important;
      animation-delay: 0s !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }

    /* ─────────────────────────────  responsive  ───────────────────────────── */

    @media (max-width: 760px) {
      .stage { padding: 80px 20px 64px; }

      .btn { padding: 0.9rem 1.35rem; font-size: 0.7rem; }

      .colophon { width: calc(100% - 40px); }

      /* one row per way of reaching us */
      .contact { grid-template-columns: 1fr; }

      .item { padding: 20px 12px; }

      .item + .item {
        border-left: 0;
        border-top: 1px solid var(--rule);
      }

      /* keep the last line clear of the floating accessibility button */
      .copy { padding-bottom: 84px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-delay: 0s !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>
  <a class="skip" href="#main">Skip to main content</a>

  <main class="stage" id="main">
    <h1 class="brand">
      <img src="AGRONOV-logo-tropical-4K.png" width="3840" height="520" alt="AGRONOV Global" />
    </h1>
  </main>

  <footer class="colophon">
    <div class="cta">
      <a class="btn" href="https://www.amazon.com/sp?ie=UTF8&amp;seller=A1PSSP1I3UBATU" target="_blank"
        rel="noopener noreferrer" aria-label="Visit our store on Amazon (opens in a new tab)">
        <svg class="smile-ico" viewBox="0 0 44 22" fill="none" stroke="#ff9900" stroke-linecap="round"
          stroke-linejoin="round" aria-hidden="true">
          <path stroke-width="3.4" d="M3 5 C13 14 29 15 39 7" />
          <path stroke-width="2.8" d="M32 4.5 L41 5.5 L39.5 13.5" />
        </svg>
        <span>VISIT OUR AMAZON STORE</span>
        <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M7 17 17 7M8 7h9v9" />
        </svg>
      </a>
    </div>

    <nav class="contact" aria-label="Contact">
      <a class="item" href="mailto:info@agronovglobal.com" aria-label="Email us at info@agronovglobal.com">
        <span class="label">Email</span>
        <span class="value">info@agronovglobal.com</span>
      </a>

      <a class="item" href="tel:+17027276966" aria-label="Call us on +1 (702) 727-6966">
        <span class="label">Phone</span>
        <span class="value">+1 (702) 727-6966</span>
      </a>

      <!-- Location → Google reviews -->
      <a class="item" href="https://maps.app.goo.gl/twcNFaXCRFdgukda8" target="_blank" rel="noopener noreferrer"
        aria-label="St. Petersburg, Florida, USA — see our reviews on Google Maps (opens in a new tab)">
        <span class="label">Location</span>
        <span class="value">
          <svg class="flag" viewBox="0 0 26 18" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
            <rect width="26" height="18" fill="#f7f8fa" />
            <g fill="#c8102e">
              <rect y="0" width="26" height="1.385" />
              <rect y="2.769" width="26" height="1.385" />
              <rect y="5.538" width="26" height="1.385" />
              <rect y="8.308" width="26" height="1.385" />
              <rect y="11.077" width="26" height="1.385" />
              <rect y="13.846" width="26" height="1.385" />
              <rect y="16.615" width="26" height="1.385" />
            </g>
            <rect width="11.4" height="9.69" fill="#0a3161" />
          </svg>
          St. Petersburg, Florida
        </span>
      </a>
    </nav>
    <p class="copy">
      <span>&copy; 2026 AGRONOV Global LLC</span>
      <a href="accessibility.html">Accessibility</a>
    </p>
  </footer>

  <!-- ─────────────────────────  accessibility panel  ───────────────────────── -->
  <div class="a11y">
    <button class="a11y-btn" id="a11yBtn" type="button" aria-expanded="false" aria-controls="a11yPanel"
      aria-label="Accessibility options">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
        stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="10" />
        <circle cx="12" cy="6.7" r="1.35" fill="currentColor" stroke="none" />
        <path d="M6.9 9.6c3.4.9 6.8.9 10.2 0" />
        <path d="M12 10.1v3.9m0 0-2.1 4.4M12 14l2.1 4.4" />
      </svg>
    </button>

    <div class="a11y-panel" id="a11yPanel" role="dialog" aria-label="Accessibility options" hidden>
      <span class="a11y-title">Accessibility</span>

      <button class="a11y-opt" type="button" data-toggle="hc" aria-pressed="false">
        <span>High contrast</span><span class="state">Off</span>
      </button>

      <button class="a11y-opt" type="button" data-cycle="scale" aria-pressed="false">
        <span>Text size</span><span class="state">100%</span>
      </button>

      <button class="a11y-opt" type="button" data-toggle="motion" aria-pressed="false">
        <span>Stop animations</span><span class="state">Off</span>
      </button>

      <button class="a11y-opt" type="button" data-toggle="links" aria-pressed="false">
        <span>Highlight links</span><span class="state">Off</span>
      </button>

      <div class="a11y-foot">
        <a href="accessibility.html">Accessibility statement</a>
        <button class="a11y-reset" type="button" id="a11yReset">Reset</button>
      </div>
    </div>
  </div>
</body>

</html>
