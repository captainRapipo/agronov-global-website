<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AGRONOV Global</title>

  <meta name="description" content="Dive into the storefront where brands go global." />
  <meta name="theme-color" content="#ffffff" />
  <meta property="og:title" content="AGRONOV Global" />
  <meta property="og:description" content="Dive into the storefront where brands go global." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://agronovglobal.com/" />

  <!-- Favicons -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=5" />
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png?v=5" />
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png?v=5" />
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=5" />

  <!-- Typography — the logo's own family -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet" />

  <link rel="preload" as="image" href="AGRONOV-logo-tropical-4K.png" />

  <!-- applies the visitor's accessibility choices before the first paint -->
  <script src="a11y.js"></script>

  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      /* paper + ink — the ink is the logo's own black */
      --paper: #ffffff;
      --ink: #0a0a0a;
      --ink-70: #444955;
      --ink-45: #6f7583;
      --rule: rgba(10, 10, 10, 0.12);

      /* the logo's tropical ramp */
      --t1: #4f74d6;
      --t2: #9a4fd0;
      --t3: #ff6f91;
      --t4: #ffb347;
      --amz: #ff9900;

      /* the drawing */
      --wall: #f4f5f9;
      --wall-side: #dfe2eb;
      --glass: #dfe8fc;
      --dark: #1d2130;
      --kraft: #d9a468;
      --kraft-top: #ebc590;
      --kraft-side: #bb874c;
      --tape: #f3dcb4;

      --ease: cubic-bezier(0.16, 1, 0.3, 1);
    }

    html {
      -webkit-text-size-adjust: 100%;
      /* driven by the accessibility panel's text-size control */
      font-size: calc(100% * var(--a11y-scale, 1));
    }

    body {
      min-height: 100dvh;
      background: var(--paper);
      color: var(--ink);
      font-family: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
      font-weight: 400;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* ───────────────────────────────  chrome  ─────────────────────────────── */

    .skip {
      position: absolute;
      left: 12px;
      top: -60px;
      z-index: 60;
      padding: 0.7rem 1.1rem;
      border-radius: 10px;
      background: var(--ink);
      color: #fff;
      font-size: 0.8rem;
      font-weight: 600;
      text-decoration: none;
      transition: top 0.2s ease;
    }

    .skip:focus { top: 12px; }

    :focus-visible {
      outline: 2px solid var(--t2);
      outline-offset: 4px;
      border-radius: 4px;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      overflow: hidden;
      clip: rect(0 0 0 0);
      clip-path: inset(50%);
      white-space: nowrap;
      border: 0;
    }

    /* ───────────────────────────────  header  ─────────────────────────────── */

    .masthead {
      display: flex;
      justify-content: flex-start;
      padding: clamp(18px, 3vh, 30px) clamp(18px, 3.4vw, 40px) 0;
      animation: fade 1s ease 0.1s both;
    }

    .btn {
      position: relative;
      overflow: hidden;
      isolation: isolate;
      display: inline-flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.9rem 1.55rem;
      border-radius: 999px;
      background: var(--ink);
      color: #fff;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-decoration: none;
      white-space: nowrap;
      box-shadow: 0 1px 2px rgba(10, 10, 10, 0.16), 0 16px 32px -18px rgba(10, 10, 10, 0.55);
      transition: transform 0.4s var(--ease), box-shadow 0.4s var(--ease);
    }

    /* the logo's ramp, darkened so white stays readable on every stop */
    .btn::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      background: linear-gradient(100deg, #3a56ad, #7a35a0 34%, #b83f5e 66%, #a8640f);
      transform: translateX(-101%);
      transition: transform 0.6s var(--ease);
    }

    .btn:hover,
    .btn:focus-visible {
      transform: translateY(-2px);
      box-shadow: 0 1px 2px rgba(10, 10, 10, 0.18), 0 24px 44px -18px rgba(154, 79, 208, 0.55);
    }

    .btn:hover::before,
    .btn:focus-visible::before { transform: translateX(0); }

    .btn .smile-ico {
      width: 22px;
      height: 12px;
      flex-shrink: 0;
      margin-top: 3px;
    }

    .btn .arrow {
      width: 14px;
      height: 14px;
      flex-shrink: 0;
      transition: transform 0.45s var(--ease);
    }

    .btn:hover .arrow,
    .btn:focus-visible .arrow { transform: translate(2px, -2px); }

    /* ───────────────────────────────  stage  ──────────────────────────────── */

    .stage {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: clamp(16px, 3vh, 36px) 20px clamp(20px, 3vh, 32px);
      text-align: center;
    }

    /* ── the warehouse ── */
    .scene {
      width: min(1240px, 100%, calc((100dvh - 250px) * 1.94));
      min-width: min(100%, 520px);
      animation: settle 1.1s var(--ease) 0.15s both;
    }

    .scene svg {
      display: block;
      width: 100%;
      height: auto;
      overflow: visible;
    }

    @keyframes settle {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: none; }
    }

    .ln {
      stroke: var(--ink);
      stroke-width: 2.25;
      stroke-linejoin: round;
      stroke-linecap: round;
    }

    .ln-thin { stroke-width: 1.5; }
    .soft { stroke: rgba(10, 10, 10, 0.22); stroke-width: 1.5; fill: none; }

    .f-wall      { fill: var(--wall); }
    .f-wall-side { fill: var(--wall-side); }
    .f-glass     { fill: var(--glass); }
    .f-dark      { fill: var(--dark); }
    .f-paper     { fill: #fff; }
    .f-kraft     { fill: var(--kraft); }
    .f-kraft-top { fill: var(--kraft-top); }
    .f-kraft-side{ fill: var(--kraft-side); }
    .f-tape      { fill: var(--tape); }
    .f-none      { fill: none; }

    .smile {
      fill: none;
      stroke: var(--amz);
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* ── contact rail ── */
    .contact {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(18px, 2.6vw, 30px);
      width: 100%;
      padding: clamp(18px, 2.8vh, 26px) 0;
      border-top: 1px solid var(--rule);
    }

    @keyframes fade {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    .sep {
      width: 1px;
      height: 18px;
      background: var(--rule);
      flex-shrink: 0;
    }

    .item {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: var(--ink);
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 500;
      white-space: nowrap;
      background: linear-gradient(90deg, var(--t1), var(--t2), var(--t3), var(--t4)) 0 100% / 0 2px no-repeat;
      padding-bottom: 3px;
      transition: background-size 0.45s var(--ease);
    }

    .item:hover,
    .item:focus-visible { background-size: 100% 2px; }

    .item .ico {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
      color: var(--ink-45);
      transition: color 0.25s ease;
    }

    .item:hover .ico,
    .item:focus-visible .ico { color: var(--t2); }

    .flag {
      width: 21px;
      height: 14px;
      flex-shrink: 0;
      border-radius: 2px;
      box-shadow: 0 0 0 1px rgba(10, 10, 10, 0.1);
    }

    /* ── footer ── */
    .colophon {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(12px, 2vh, 18px);
      width: min(1240px, calc(100% - 48px));
      margin: 0 auto;
      padding-bottom: clamp(20px, 3vh, 30px);
      animation: fade 1s ease 0.55s both;
    }

    .copy {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 6px 14px;
      font-size: 0.74rem;
      color: var(--ink-45);
    }

    .copy a {
      color: inherit;
      text-underline-offset: 3px;
      text-decoration-color: var(--rule);
      transition: color 0.25s ease;
    }

    .copy a:hover,
    .copy a:focus-visible { color: var(--ink); }

    /* ──────────────────────────  accessibility ui  ────────────────────────── */

    .a11y {
      position: fixed;
      right: clamp(14px, 2.4vw, 26px);
      bottom: clamp(14px, 2.4vw, 26px);
      z-index: 40;
    }

    .a11y-btn {
      display: grid;
      place-items: center;
      width: 46px;
      height: 46px;
      padding: 0;
      border: 1px solid var(--rule);
      border-radius: 50%;
      background: #fff;
      color: var(--ink);
      cursor: pointer;
      box-shadow: 0 10px 26px -12px rgba(10, 10, 10, 0.42);
      transition: transform 0.35s var(--ease), box-shadow 0.35s var(--ease);
    }

    .a11y-btn svg {
      width: 24px;
      height: 24px;
    }

    .a11y-btn:hover,
    .a11y-btn:focus-visible {
      transform: translateY(-2px);
      box-shadow: 0 16px 32px -14px rgba(10, 10, 10, 0.5);
    }

    .a11y-panel {
      position: absolute;
      right: 0;
      bottom: calc(100% + 12px);
      width: min(290px, calc(100vw - 32px));
      padding: 14px;
      border: 1px solid var(--rule);
      border-radius: 18px;
      background: #fff;
      box-shadow: 0 26px 60px -20px rgba(10, 10, 10, 0.4);
      text-align: left;
      animation: pop-up 0.25s var(--ease) both;
    }

    @keyframes pop-up {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: none; }
    }

    .a11y-title {
      display: block;
      margin-bottom: 10px;
      padding: 0 4px;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--ink);
    }

    .a11y-opt {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      width: 100%;
      padding: 10px 12px;
      border: 0;
      border-radius: 11px;
      background: none;
      color: var(--ink);
      font: inherit;
      font-size: 0.83rem;
      font-weight: 500;
      text-align: left;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .a11y-opt:hover { background: rgba(10, 10, 10, 0.045); }

    .a11y-opt .state {
      flex-shrink: 0;
      font-size: 0.74rem;
      font-weight: 600;
      color: var(--ink-45);
    }

    .a11y-opt[aria-pressed="true"] { background: rgba(10, 10, 10, 0.055); }
    .a11y-opt[aria-pressed="true"] .state { color: var(--t2); }

    .a11y-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-top: 10px;
      padding: 10px 12px 2px;
      border-top: 1px solid var(--rule);
    }

    .a11y-foot a,
    .a11y-reset {
      border: 0;
      background: none;
      padding: 0;
      color: var(--ink-70);
      font: inherit;
      font-size: 0.76rem;
      text-decoration: underline;
      text-underline-offset: 3px;
      cursor: pointer;
    }

    .a11y-foot a:hover,
    .a11y-reset:hover { color: var(--ink); }

    /* — the four modes the panel can put the page into — */

    [data-hc="on"] {
      --ink: #000000;
      --ink-70: #000000;
      --ink-45: #1a1a1a;
      --rule: rgba(0, 0, 0, 0.55);
      --t2: #5a1f86;
    }

    [data-hc="on"] body { background: #fff; }

    [data-hc="on"] .a11y-btn,
    [data-hc="on"] .a11y-panel { border-color: #000; background: #fff; }

    [data-hc="on"] .btn::before { display: none; }

    [data-links="on"] a:not(.skip):not(.btn) {
      text-decoration: underline;
      text-underline-offset: 4px;
      text-decoration-thickness: 2px;
    }

    [data-motion="off"] *,
    [data-motion="off"] *::before,
    [data-motion="off"] *::after {
      animation-duration: 0.01ms !important;
      animation-delay: 0s !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }

    /* ─────────────────────────────  responsive  ───────────────────────────── */

    @media (max-width: 640px) {
      .masthead { padding: 16px 16px 0; }

      .btn { padding: 0.8rem 1.25rem; font-size: 0.74rem; }

      .stage { padding: 20px 12px; }

      /* the drawing runs a little past the gutters so it keeps its size */
      .scene { width: calc(100% + 24px); min-width: 0; }

      /* three rows, one per way of reaching us, icons on a common edge */
      .contact {
        flex-direction: column;
        align-items: flex-start;
        width: auto;
        min-width: min(300px, 100%);
        gap: 14px;
      }

      .sep { display: none; }

      .item { font-size: 0.93rem; }

      /* keep the last line clear of the floating accessibility button */
      .colophon { padding-bottom: 80px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-delay: 0s !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>

  <header class="masthead">
    <a class="btn" href="https://www.amazon.com/sp?ie=UTF8&amp;seller=A1PSSP1I3UBATU" target="_blank"
      rel="noopener noreferrer" aria-label="Visit our store on Amazon (opens in a new tab)">
      <svg class="smile-ico" viewBox="0 0 44 22" fill="none" stroke="#ff9900" stroke-linecap="round"

        <path d="M7 17 17 7M8 7h9v9" />
      </svg>
    </a>
  </header>

  <main class="stage" id="main">
    <h1 class="sr-only">AGRONOV Global LLC</h1>

    <!-- Decorative: the warehouse, with stock waiting outside it -->
    <div class="scene" aria-hidden="true">
      <svg viewBox="40 20 700 360" xmlns="http://www.w3.org/2000/svg" focusable="false">
        <defs>
          <linearGradient id="ramp" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#4f74d6" />
            <stop offset="0.34" stop-color="#9a4fd0" />
            <stop offset="0.68" stop-color="#ff6f91" />
            <stop offset="1" stop-color="#ffb347" />
          </linearGradient>
          <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#4f74d6" />
            <stop offset="0.4" stop-color="#9a4fd0" />
            <stop offset="0.72" stop-color="#ff6f91" />
            <stop offset="1" stop-color="#ffb347" />
          </linearGradient>
        </defs>

        <!-- sun behind the roofline, and the ground -->
        <circle cx="612" cy="112" r="84" fill="url(#sun)" opacity="0.18" />
        <ellipse cx="420" cy="362" rx="320" ry="12" fill="#0a0a0a" opacity="0.05" />

        <!-- ═══ warehouse ═══ -->
        <g>
          <!-- side wall -->
          <path class="f-wall-side ln" d="M660 176 L700 152 L700 336 L660 360 Z" />
          <path class="soft" d="M673.5 168 V352 M686.5 160 V344" />

          <!-- barrel roof: top surface, then the front edge -->
          <path class="ln" fill="url(#ramp)" d="M318 172 Q495 60 672 172 L712 148 Q535 36 358 148 Z" />
          <path class="soft" d="M338 160 Q515 48 692 160" />

          <!-- front wall -->
          <path class="f-wall ln" d="M330 360 L330 176 Q495 72 660 176 L660 360 Z" />
          <path class="ln" fill="url(#ramp)" d="M318 172 Q495 60 672 172 L660 176 Q495 72 330 176 Z" />
          <path fill="#0a0a0a" opacity="0.22" d="M318 172 Q495 60 672 172 L660 176 Q495 72 330 176 Z" />

          <!-- vent -->
          <circle class="f-paper ln" cx="495" cy="146" r="12" />
          <path class="ln ln-thin f-none" d="M483 146 H507 M495 134 V158" />

          <!-- sign -->
          <rect class="f-paper ln" x="400" y="174" width="190" height="38" rx="5" />
          <image href="AGRONOV-logo-tropical-4K.png" x="409" y="180.5" width="172" height="23.3" />

          <!-- windows -->
          <rect class="f-glass ln" x="352" y="250" width="64" height="42" rx="3" />
          <path class="ln ln-thin f-none" d="M384 250 V292" />
          <path class="f-none" stroke="#fff" stroke-width="3" stroke-linecap="round" d="M360 280 L372 258" />
          <rect class="f-glass ln" x="574" y="250" width="64" height="42" rx="3" />
          <path class="ln ln-thin f-none" d="M606 250 V292" />
          <path class="f-none" stroke="#fff" stroke-width="3" stroke-linecap="round" d="M582 280 L594 258" />

          <!-- lamp over the door -->
          <path class="ln f-none" d="M495 218 V224" />
          <path class="ln" fill="#ffb347" d="M486 224 H504 L500 230 H490 Z" />

          <!-- roll-up door, two-thirds open, stock inside -->
          <rect class="f-wall-side ln" x="434" y="236" width="122" height="124" />
          <rect class="f-dark" x="442" y="244" width="106" height="116" />
          <rect class="f-kraft-side" x="452" y="326" width="36" height="34" />
          <rect class="f-kraft" x="494" y="312" width="44" height="48" opacity="0.85" />
          <rect class="f-kraft-side" x="500" y="296" width="30" height="16" opacity="0.7" />
          <rect class="f-paper ln" x="442" y="244" width="106" height="62" />
          <path class="soft" d="M442 256 H548 M442 268 H548 M442 280 H548 M442 292 H548" />
          <rect class="f-dark" x="485" y="300" width="20" height="4" rx="2" />

          <!-- base -->
          <path class="ln f-none" d="M330 360 L660 360" />
        </g>

        <!-- ground line -->
        <path class="ln f-none" d="M60 360 H728" />

        <!-- ═══ boxes ═══ -->

        <!-- leaning against the stack -->
        <g transform="translate(150.5 360) rotate(18)">
          <path class="f-kraft-side ln" d="M0 -118 L12 -126 L12 -8 L0 0 Z" />
          <path class="f-kraft-top ln" d="M-52 -118 L-40 -126 L12 -126 L0 -118 Z" />
          <rect class="f-kraft ln" x="-52" y="-118" width="52" height="118" />
          <rect class="f-tape" x="-52" y="-66" width="52" height="11" />
          <path class="ln ln-thin f-none" d="M-52 -66 H0 M-52 -55 H0" />
          <!-- this way up -->

        </g>

        <!-- bottom of the stack -->

          <path class="f-kraft-side ln" d="M320 300 L338 288 L338 348 L320 360 Z" />
          <path class="f-kraft-top ln" d="M170 300 L188 288 L338 288 L320 300 Z" />
          <rect class="f-kraft ln" x="170" y="300" width="150" height="60" />
          <path class="f-tape" d="M238 300 L256 288 L268 288 L250 300 Z" />
          <rect class="f-tape" x="238" y="300" width="12" height="20" />
          <path class="ln ln-thin f-none" d="M238 300 V320 H250 V300" />
          <!-- shipping label -->
          <rect class="f-paper ln ln-thin" x="268" y="314" width="38" height="28" rx="2" />
          <path class="ln ln-thin f-none" d="M274 322 H300 M274 328 H294 M274 334 H298" />
        </g>

        <!-- top of the stack, with the smile -->
        <g>
          <path class="f-kraft-side ln" d="M300 244 L318 232 L318 288 L300 300 Z" />
          <path class="f-kraft-top ln" d="M196 244 L214 232 L318 232 L300 244 Z" />
          <rect class="f-kraft ln" x="196" y="244" width="104" height="56" />
          <path class="f-tape" d="M242 244 L260 232 L272 232 L254 244 Z" />
          <path class="smile" stroke-width="4.5" d="M222 266 C236 279 258 280 272 268" />
          <path class="smile" stroke-width="3.6" d="M264 264.5 L275 266 L273.5 276" />
        </g>
      </svg>
    </div>

  </main>

  <footer class="colophon">
    <nav class="contact" aria-label="Contact">
      <!-- Email -->
      <a class="item" href="mailto:info@agronovglobal.com" aria-label="Email us at info@agronovglobal.com">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="2.5" y="4.5" width="19" height="15" rx="2.5" />
          <path d="m3 7 8.13 5.42a1.6 1.6 0 0 0 1.74 0L21 7" />
        </svg>
